    <linearGradient id="flask" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F8FFFF"/><stop offset="1" stop-color="#CFF5F1"/></linearGradient>
    <linearGradient id="wordTeal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087D83"/><stop offset="1" stop-color="#1B9AAA"/></linearGradient>
  </defs>
  <g transform="translate(4 4)">
