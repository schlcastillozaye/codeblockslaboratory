    <rect x="9" y="9" width="46" height="46" rx="13" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".16"/>
    <path d="M25 19v13l-8 13c-2 3 .1 7 3.8 7h22.4c3.7 0 5.8-4 3.8-7l-8-13V19" fill="url(#flask)" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
